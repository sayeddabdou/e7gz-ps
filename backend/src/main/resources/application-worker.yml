# Profile "worker": deadline worker, outbox dispatcher, projection worker, session generator (arch 12 §1.3).
e7gz:
  datasource:
    app:
      # Small on purpose: SKIP LOCKED polling is cheap (arch 12 §1.4). 8, not 5, since E7-41: the deadline worker uses 3
      # (LISTEN sched + 2 threads), the outbox dispatcher up to 3 (LISTEN outbox + 1 thread + its consumer's command).
      maximum-pool-size: 8
