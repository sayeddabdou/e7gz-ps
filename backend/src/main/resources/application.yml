spring:
  application:
    name: e7gz-backend
  # Flyway migrates as the object owner (arch 04 §5–§6). Defaults point at `docker compose` (port 5433).
  flyway:
    url: ${E7GZ_DB_URL:jdbc:postgresql://localhost:5433/e7gz_ps}
    user: ${E7GZ_DB_MIGRATOR_USER:e7gz_migrator}
    password: ${E7GZ_DB_MIGRATOR_PASSWORD:e7gz_migrator}
    # V1__baseline.sql is a pgModeler export that assumes it runs as "postgres" (every object is OWNER TO postgres,
    # and a sequence must share its table's owner). The migrator logs in and acts as postgres for the migration.
    init-sqls: SET ROLE postgres
    # Flyway's history table lives in its own schema, apart from the model's 18 schemas and PostGIS in "public".
    default-schema: flyway
    create-schemas: true

# The app never connects as the owner. Two runtime connections (arch 04 §5):
#   app   — e7gz_app_runtime, used by the api and worker profiles (primary DataSource)
#   admin — e7gz_admin_runtime, used by Platform Admin commands (bean "adminDataSource")
e7gz:
  datasource:
    app:
      jdbc-url: ${E7GZ_DB_URL:jdbc:postgresql://localhost:5433/e7gz_ps}
      username: ${E7GZ_DB_APP_USER:e7gz_app_runtime}
      password: ${E7GZ_DB_APP_PASSWORD:e7gz_app_runtime}
      pool-name: app
      maximum-pool-size: 10        # arch 12 §1.4
    admin:
      jdbc-url: ${E7GZ_DB_URL:jdbc:postgresql://localhost:5433/e7gz_ps}
      username: ${E7GZ_DB_ADMIN_USER:e7gz_admin_runtime}
      password: ${E7GZ_DB_ADMIN_PASSWORD:e7gz_admin_runtime}
      pool-name: admin
      maximum-pool-size: 3
  # Phone OTP by SMS (Spec v5 §7.3). "log" writes the code to the log (local only); deployed environments set
  # E7GZ_SMS_PROVIDER=sms-misr and the SMS Misr account from the secret store (arch 12 §3). Never commit credentials.
  sms:
    provider: ${E7GZ_SMS_PROVIDER:log}
    sms-misr:
      environment: ${E7GZ_SMS_MISR_ENVIRONMENT:TEST}   # LIVE sends real SMS; production only
      username: ${E7GZ_SMS_MISR_USERNAME:}
      password: ${E7GZ_SMS_MISR_PASSWORD:}
      sender: ${E7GZ_SMS_MISR_SENDER_TOKEN:}
      template: ${E7GZ_SMS_MISR_TEMPLATE_TOKEN:}
  # Customer push (E7-43; arch 01 decision A7: FCM for Android and, through APNs, iPhone). "log" writes pushes to the
  # worker log (local only); deployed environments set E7GZ_PUSH_PROVIDER=fcm and E7GZ_FCM_SERVICE_ACCOUNT = Base64 of
  # the Firebase service-account JSON, from the secret store (E7-101: set up with the PO before deployment).
  push:
    provider: ${E7GZ_PUSH_PROVIDER:log}
    fcm:
      service-account: ${E7GZ_FCM_SERVICE_ACCOUNT:}
  # Venue Dashboard Web Push (E7-44; ADR-014, 01 §14 A6; PO decisions 10 Oct 2026). "log" writes venue pushes to the
  # worker log, so no developer needs keys; the api then serves a development public key whose private half was never
  # kept. Deployed environments set E7GZ_WEB_PUSH_PROVIDER=vapid and, from the secret store (E7-101), one VAPID pair
  # per environment (`npx web-push generate-vapid-keys`: URL-safe Base64, public = 65-byte point, private = 32 bytes)
  # and E7GZ_VAPID_SUBJECT = mailto:<the contact the PO chooses>. The vapid provider refuses to start without them.
  web-push:
    provider: ${E7GZ_WEB_PUSH_PROVIDER:log}
    vapid:
      public-key: ${E7GZ_VAPID_PUBLIC_KEY:BGZ958V3CWVr6vpUWx61GhoDuaj-RB9Vc8rmoIimFmbVbXzbF9N9PcKeBBmWb767gQlGHfIlP2Njl-IGgz3TyZM}
      private-key: ${E7GZ_VAPID_PRIVATE_KEY:}
      subject: ${E7GZ_VAPID_SUBJECT:mailto:dev@e7gz.local}
  # The venue live channel (E7-44; arch 08 §5): `: heartbeat` every 15 s, which also closes the streams of an account
  # that is no longer ENABLED; a stream ends after 1 h and the Dashboard reconnects. Each api replica holds one app
  # connection to LISTEN once a Dashboard has connected to it.
  venue-stream:
    heartbeat: 15s
    max-duration: 1h
  # Notification email (E7-43, FR-NTF-03). Locally the defaults reach Mailpit (docker compose; inbox on
  # http://localhost:8025); deployed environments set the SMTP provider from the secret store (E7-101).
  email:
    provider: ${E7GZ_EMAIL_PROVIDER:smtp}
    from: ${E7GZ_EMAIL_FROM:E7GZ PS <no-reply@e7gz.local>}
    smtp:
      host: ${E7GZ_SMTP_HOST:localhost}
      port: ${E7GZ_SMTP_PORT:1025}
      username: ${E7GZ_SMTP_USERNAME:}
      password: ${E7GZ_SMTP_PASSWORD:}
      start-tls: ${E7GZ_SMTP_START_TLS:false}
  # Phone OTP in the outbox payload is sealed with AES-256-GCM (arch 10 §2.2; PO decision 9 Oct 2026, E7-41): Base64 of
  # 32 random bytes, e.g. `openssl rand -base64 32`. From the environment / secret store only (arch 12 §3), separate per
  # environment; no default, so neither the api nor the worker starts without one.
  identity:
    otp-payload-key: ${E7GZ_OTP_PAYLOAD_KEY:}
  # Idempotency fingerprints (ADR-015, E7-42): a secret request field (Owner Password, PIN, ...) enters the stored
  # fingerprint only as an HMAC-SHA256 under this key. Base64 of 32 random bytes (`openssl rand -base64 32`), from the
  # environment / secret store only (arch 12 §3), the same on every replica of an environment; no default, so the app
  # does not start without one. Changing it makes a retry of an in-flight request that carries a secret a 422.
  idempotency:
    fingerprint-key: ${E7GZ_IDEMPOTENCY_FINGERPRINT_KEY:}
  # Access JWT signing key (arch 10 §2.3, HS512): Base64 of at least 64 random bytes, e.g. `openssl rand -base64 64`.
  # From the environment / secret store only (arch 12 §3); no default, so the app does not start without one.
  security:
    jwt:
      secret: ${E7GZ_JWT_SECRET:}
    # Browser origins of the Venue Dashboard and Platform Admin (E7-22, Sprint 0 review S-4): CORS with credentials and
    # the cookie session's refresh/logout accept only these. Comma-separated exact origins, no wildcard. Empty = none.
    # Local dev: E7GZ_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174
    cors:
      allowed-origins: ${E7GZ_CORS_ALLOWED_ORIGINS:}
  # Venue photos in S3-compatible storage (arch 12 §2, E7-23 PR 3). Defaults are the docker compose SeaweedFS; deployed
  # environments set the E7GZ_S3_* values from the secret store and E7GZ_S3_CREATE_BUCKET=false (buckets: E7-101).
  # The public endpoint is what browsers reach in signed links, when it differs from the endpoint the backend calls.
  object-store:
    endpoint: ${E7GZ_S3_ENDPOINT:http://localhost:8333}
    public-endpoint: ${E7GZ_S3_PUBLIC_ENDPOINT:}
    region: ${E7GZ_S3_REGION:us-east-1}
    bucket: ${E7GZ_S3_BUCKET:e7gz-venue-photos}
    access-key: ${E7GZ_S3_ACCESS_KEY:e7gz-dev}
    secret-key: ${E7GZ_S3_SECRET_KEY:e7gz-dev-secret}
    create-bucket: ${E7GZ_S3_CREATE_BUCKET:true}
    allowed-origins: ${E7GZ_CORS_ALLOWED_ORIGINS:}
  # PCR-005 limits and the PO decisions of 3 Oct 2026; see VenuePhotoProperties for every setting.
  venue-photos:
    max-size-bytes: 5242880
    max-visible: 10
    upload-link-ttl: 10m
    view-link-ttl: 1h
    cleanup-at: "03:30"            # nightly, Africa/Cairo (quoted: YAML would read 03:30 as a number)
  # Operating Sessions are materialized this many operating days ahead (ADR-009, arch 01 §14 A2): a deployment
  # setting, not a Product booking limit. The worker extends the horizon nightly (see OperatingSessionProperties).
  operating-sessions:
    horizon-days: ${E7GZ_SESSION_HORIZON_DAYS:120}
    extend-at: "03:15"             # nightly, Africa/Cairo
  # Nearest Availability (arch 05 §5.3): the worker refreshes every venue / activity pair this often (PO decision
  # 8 Oct 2026), besides the refresh on each inventory event the outbox dispatches (E7-41); it also keeps up with time
  # passing.
  availability:
    projection:
      refresh-every: ${E7GZ_AVAILABILITY_REFRESH_EVERY:1m}
  # The deadline worker of the worker profile (arch 08 §2, ADR-006; see SchedulerProperties). Every timer, Product
  # deadlines and system jobs alike, is a row of technical.scheduled_job; there is no @Scheduled anywhere (E7-40).
  scheduler:
    tick: 1s                       # idle poll; pg_notify('sched') wakes the workers sooner
    threads: 2
    lease: 5m
    max-attempts: 5
    first-backoff: 10s
    max-backoff: 10m
    invariant-sweep-at: "04:00"    # nightly integrity sweep, Africa/Cairo (arch 11 §4)
  # The outbox dispatcher of the worker profile (arch 08 §4, ADR-004; see OutboxProperties). Commands write events in
  # their own transaction; pg_notify('outbox') wakes the dispatcher at commit, the tick is the safety net.
  outbox:
    tick: 1s
    threads: 1
    retry-delays: 5s, 30s, 2m, 10m, 1h   # arch 08 §4.3; the 6th attempt failing too is DEAD_LETTER (Sev-2)

# Every log line carries the correlation ID of its request or job (NFR-32; CorrelationId puts it in the MDC).
# JSON log output is the observability task's (arch 11 §5.1, E7-100); this only adds the field to the default pattern.
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

# OpenAPI 3.1 generated from the controllers (ADR-012). Keys sorted so the committed openapi.json diffs cleanly.
springdoc:
  api-docs:
    version: openapi_3_1
  writer-with-order-by-keys: true
  # REST + JSON (arch 09): document responses as application/json, not */*.
  default-produces-media-type: application/json
