# Push and email copy by notification code (ADR-021; PO decision 10 Oct 2026). UTF-8.
# Keys: <CODE>.push.title, <CODE>.push.body, <CODE>.email.subject, <CODE>.email.body; {name} = notification param.
# Each task that emits a PUSH or EMAIL code adds its copy here; the PO reviews the wording in the PR.
# Never a status, rule or timer the apps would show differently: the in-app text comes from the apps' own catalogues.

# E7-43 (FR-ADM-03, FR-VEN-05). Venue in-app today; Web Push from E7-44. Never the password itself.
VENUE_OWNER_PASSWORD_RESET.push.title=Owner Password changed
VENUE_OWNER_PASSWORD_RESET.push.body=The platform admin set a new Owner Password for your venue.

# E7-55: booking notifications (Spec v5 sections 52.2 and 52.5). One wording per code: each customer push body is the
# customer app's in-app text for the code (apps/customer/src/i18n/en.ts, notifications.messages / .templates).
BOOKING_CREATED.push.title=Booking request sent
BOOKING_CREATED.push.body=Your booking request was sent to the venue.
BOOKING_CONFIRMED.push.title=Booking confirmed
BOOKING_CONFIRMED.push.body=The venue confirmed your booking at {venueName}.
BOOKING_REJECTED.push.title=Booking request rejected
BOOKING_REJECTED.push.body=The venue rejected your booking request at {venueName}.
REJECTED_AFTER_EXPIRY.push.title=Booking request rejected
REJECTED_AFTER_EXPIRY.push.body=The venue rejected the booking after its response deadline.
VENUE_RESPONSE_EXPIRED.push.title=No answer from the venue
VENUE_RESPONSE_EXPIRED.push.body=The venue did not respond in time.
BOOKING_AUTO_CANCELLED.push.title=Booking cancelled
BOOKING_AUTO_CANCELLED.push.body=Your booking was cancelled automatically.
BOOKING_CANCELLED.push.title=Booking cancelled
BOOKING_CANCELLED.push.body=Your booking was cancelled.
BOOKING_STARTS_SOON.push.title=Booking starts soon
BOOKING_STARTS_SOON.push.body=Your booking at {venueName} starts soon.

# E7-55: venue booking notifications (Spec v5 section 52.5, FR-NTF-09), Web Push in the account's language.
VENUE_NEW_BOOKING_REQUEST.push.title=New booking request
VENUE_NEW_BOOKING_REQUEST.push.body=A customer sent a new booking request. Open the Dashboard to answer it.
VENUE_PENDING_REQUEST_EXPIRING.push.title=Booking request expiring
VENUE_PENDING_REQUEST_EXPIRING.push.body=A booking request is about to expire. Accept or reject it now.
VENUE_BOOKING_AUTO_CANCELLED.push.title=Booking cancelled automatically
VENUE_BOOKING_AUTO_CANCELLED.push.body=A booking was cancelled automatically by the system.
