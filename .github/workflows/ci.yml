# Every pull request and every push to main (E7-11, DEVELOPER-GUIDE.md §7).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — unit, integration, ArchUnit, OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers needs Docker; fail here, clearly, rather than letting the integration tests error one by one.
      # (Nothing in the test suite skips when Docker is missing — PostgresTestContainer fails to start instead.)
      - run: docker info --format 'Docker {{.ServerVersion}}'
      # Unit + integration (Testcontainers PostGIS) + ArchUnit + OpenApiContractTest (fails when the committed
      # packages/api-client/openapi.json does not match the controllers) + OpenApiSampleContractTest (writes the
      # test-only sample contract for the chain job).
      - run: ./gradlew check
      - uses: actions/upload-artifact@v4
        with:
          name: sample-contract
          path: backend/build/generated-contracts/sample.openapi.json
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  # E7-34 done-when: the venue list's p95 on the perf seed (NFR-11, target < 1 s), recorded as a NON-BLOCKING report.
  # Its own job, so the backend job stays as fast as before. Non-blocking at two levels:
  #  - job-level continue-on-error: no failure anywhere in this job (setup, Docker, seed, start-up, measurement, report
  #    or artifact upload) fails the workflow run; no other job needs this one;
  #  - the measuring step's own continue-on-error keeps the job's later steps running, and its outcome and the p95 are
  #    written to the log and the job summary, so a failure is reported, not hidden.
  discovery-perf:
    name: Discovery p95 on the perf seed (report, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: docker info --format 'Docker {{.ServerVersion}}'
      - id: measure
        continue-on-error: true
        run: ./gradlew discoveryPerf
      - if: always()
        run: |
          {
            echo "discoveryPerf outcome: ${{ steps.measure.outcome || 'not run (setup failed)' }} (non-blocking report)"
            echo
            if [ -f build/reports/discovery-perf.md ]; then
              cat build/reports/discovery-perf.md
            else
              echo "Discovery p95 report was not produced; see the discoveryPerf step log."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: discovery-perf-report
          path: backend/build/reports/discovery-perf.md
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontends — lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # engineStrict (pnpm-workspace.yaml): fails if any package does not support this Node version.
      - run: pnpm install --frozen-lockfile
      # api-client and the three apps run real checks (packages/tokens is still an E7-18 placeholder). pnpm -r runs
      # api-client first: it regenerates its TS types from the committed openapi.json, so every app type-checks,
      # builds and tests against the current contract.
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      # Vite builds of the two web apps; Expo export (web + Android bundle) of the customer app.
      - run: pnpm -r build
      # api-client: the `pnpm mock` launcher on the committed contract. Apps: loading / success / error screens.
      - run: pnpm --workspace-concurrency=1 -r test

  contract-chain:
    name: Contract chain — Java sample contract → TS types → client + mock
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: sample-contract
          path: backend/build/generated-contracts
      # Types from the Java-generated contract; compile-time positive and negative cases; the fetch wrapper against
      # injected fetch; the `pnpm mock` launcher on that contract.
      - run: pnpm --filter @e7gz/api-client test:chain
